[project]
name = "telegram-post-migrator"
version = "0.1.0"
description = "Safe Telegram post migration with date/count filters and Saved Messages control"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.25.2",
  "psycopg[binary]==3.2.9",
  "SQLAlchemy==2.0.43",
  "Telethon==1.44.0",
]

[project.scripts]
tg-migrator = "tg_migrator.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tg_migrator*"]
